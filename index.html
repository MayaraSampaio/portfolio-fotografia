<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Felipa Sato - Portfolio</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Seu CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container-fluid">
          <a class="navbar-brand" href="./index.html">Felipa Sato</a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Alternar navegação"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav ms-auto fs-5">
              <a class="nav-link active" href="./index.html">Home</a>
              <a class="nav-link" href="./servicos-page/servico.html"
                >Serviços</a
              >
              <a class="nav-link" href="./blog-page/blog.html">Blog</a>
              <a class="nav-link" href="./contacto-page/contacto.html"
                >Contato</a
              >
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- GALERIA / CARROSSEL -->
      <section class="py-5 text-white bg-black">
        <div class="container text-center mb-4">
          <h1 class="mb-3">Meu Trabalho</h1>
          <p class="text-secondary">Sessões em estúdio e casamentos reais.</p>
        </div>

        <div id="cardCarousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <!-- SLIDE 1 (Estúdio) -->
            <div class="carousel-item active">
              <div class="container">
                <div
                  class="row row-cols-1 row-cols-md-3 g-4 justify-content-center"
                >
                  <div class="col">
                    <div class="card bg-black border border-secondary">
                      <img
                        src="/assets/estudio1.jpg"
                        alt="Retrato em estúdio 1"
                      />
                    </div>
                  </div>

                  <div class="col">
                    <div class="card bg-black border border-secondary">
                      <img
                        src="/assets/estudio2.jpg"
                        alt="Retrato em estúdio 2"
                      />
                    </div>
                  </div>

                  <div class="col">
                    <div class="card bg-black border border-secondary">
                      <img
                        src="/assets/estudio3.jpg"
                        alt="Retrato em estúdio 3"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- SLIDE 2 (Casamento) -->
            <div class="carousel-item">
              <div class="container">
                <div
                  class="row row-cols-1 row-cols-md-3 g-4 justify-content-center"
                >
                  <div class="col">
                    <div class="card bg-black border border-secondary">
                      <img src="/assets/casamento1.jpg" alt="Casamento 1" />
                    </div>
                  </div>

                  <div class="col">
                    <div class="card bg-black border border-secondary">
                      <img src="/assets/casamento2.jpg" alt="Casamento 2" />
                    </div>
                  </div>

                  <div class="col">
                    <div class="card bg-black border border-secondary">
                      <img src="/assets/casamento3.jpg" alt="Casamento 3" />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- SLIDE 3 (Misto / extra) -->
            <div class="carousel-item">
              <div class="container">
                <div
                  class="row row-cols-1 row-cols-md-3 g-4 justify-content-center"
                >
                  <div class="col">
                    <div class="card bg-black border border-secondary">
                      <img src="/assets/casamento4.jpg" alt="Casamento 4" />
                    </div>
                  </div>

                  <div class="col">
                    <div class="card bg-black border border-secondary">
                      <img
                        src="/assets/estudio6.jpg"
                        alt="Retrato em estúdio 6"
                      />
                    </div>
                  </div>

                  <div class="col">
                    <div class="card bg-black border border-secondary">
                      <img
                        src="/assets/estudio7.jpg"
                        alt="Retrato em estúdio 7"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- SETAS -->
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#cardCarousel"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>

          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#cardCarousel"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Próximo</span>
          </button>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="container-fluid text-center text-white py-5 bg-black">
      <div>
        <hr class="border-secondary" />
        <h5>Felipa Sato</h5>

        <ul
          class="list-unstyled d-flex justify-content-center align-items-center gap-2 m-0 p-0"
        >
          <li>
            <a
              href="#"
              class="text-white text-decoration-none d-flex align-items-center justify-content-center"
            >
              <img
                src="/assets/icons/insta-icon.svg"
                alt="Instagram"
                width="30"
                height="30"
              />
            </a>
          </li>

          <li>
            <a
              href="#"
              class="text-white text-decoration-none d-flex align-items-center justify-content-center"
            >
              <img
                src="/assets/icons/linkedin-icon.svg"
                alt="LinkedIn"
                width="30"
                height="30"
              />
            </a>
          </li>

          <li>
            <a
              href="#"
              class="text-white text-decoration-none d-flex align-items-center justify-content-center"
            >
              <img
                src="/assets/icons/facebook-icon.svg"
                alt="Facebook"
                width="30"
                height="30"
              />
            </a>
          </li>
        </ul>

        <p class="footer-credit m-3">Powered by Aricia, Jandira and Mayara</p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
